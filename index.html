<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北大生協ルームガイド 共有事項</title>
    <!-- Google Fonts: Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-center items-center">

    <!-- パスワード認証画面 -->
    <div id="authScreen" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white border border-slate-200 rounded-2xl max-w-sm w-full p-6 shadow-xl">
            <h2 class="text-lg font-bold text-slate-900 mb-2 text-center">アクセス認証</h2>
            <p class="text-xs text-slate-500 mb-4 text-center">閲覧するにはパスワードを入力してください</p>
            <form onsubmit="handleLogin(event)" class="space-y-3">
                <input type="password" id="passwordInput" placeholder="パスワードを入力" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 focus:border-blue-500 text-slate-800 rounded-xl focus:outline-none">
                <p id="authError" class="text-xs text-rose-500 hidden text-center">パスワードが間違っています</p>
                <button type="submit" id="authBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl text-sm font-medium transition">入室する</button>
            </form>
        </div>
    </div>

    <!-- メインコンテンツ（認証後に表示） -->
    <div id="mainContent" class="max-w-3xl w-full mx-auto px-4 py-8 hidden min-h-screen flex flex-col">
        <!-- ヘッダー -->
        <header class="mb-6 flex justify-between items-center border-b border-slate-200 pb-4">
            <div>
                <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                    <span class="text-blue-600">#</span> 共有事項ボード
                </h1>
                <p class="text-xs text-slate-500 mt-1"></p>
            </div>
            <div class="flex items-center gap-3">
                <!-- 新規投稿ボタン（Googleフォームへ遷移） -->
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSdws5l84JJlbujW1dVDxuACpUF7g2CjC3LtNEmOgAwUyO7JcA/viewform?usp=publish-editor" target="_blank" rel="noopener noreferrer" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-medium shadow-sm transition inline-flex items-center gap-1.5">
                    <span>+ 新規投稿</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                    </svg>
                </a>
                <!-- ログアウト（ロック）ボタン -->
                <button onclick="handleLogout()" class="text-xs text-slate-400 hover:text-rose-600 transition px-2 py-1">ロック</button>
            </div>
        </header>

        <!-- 検索バー ＆ ソート切替エリア -->
        <div class="flex flex-col sm:flex-row gap-3 mb-6">
            <div class="relative flex-1">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </span>
                <input type="text" id="searchInput" oninput="renderApp()" placeholder="キーワードで検索（タイトル、内容、担当者など）..." class="w-full pl-9 pr-4 py-2 text-xs bg-white border border-slate-200 focus:border-blue-500 text-slate-800 rounded-xl focus:outline-none shadow-xs">
            </div>
            <div class="sm:w-48">
                <select id="sortSelect" onchange="renderApp()" class="w-full px-3 py-2 text-xs bg-white border border-slate-200 focus:border-blue-500 text-slate-800 rounded-xl focus:outline-none shadow-xs cursor-pointer">
                    <option value="desc">日付：新しい順 (降順)</option>
                    <option value="asc">日付：古い順 (昇順)</option>
                </select>
            </div>
        </div>

        <!-- カテゴリ切り替えタブ -->
        <div id="categoryTabs" class="flex gap-2 overflow-x-auto pb-3 mb-6 scrollbar-none">
            <!-- JavaScriptで動的生成 -->
        </div>

        <!-- 共有事項一覧（最初からスレッド展開されたEmbedブロック表示） -->
        <div id="noticeGrid" class="space-y-6">
            <p class="text-center text-slate-400 py-12">データを読み込んでいます...</p>
        </div>
    </div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzSxqlj6ewGzifvqcHJZkAIma3lB7m0teHf688spGe2B7v8fFn7HDYSiKw0JZv8mMYr-g/exec";

        let appState = {
            notices: [],
            comments: [],
            currentCategory: "すべて",
            password: ""
        };

        window.addEventListener('DOMContentLoaded', () => {
            const isAuth = localStorage.getItem('rg_is_authenticated');
            const savedPass = localStorage.getItem('rg_pass_cache');
            
            if (isAuth === 'true' && savedPass) {
                appState.password = savedPass;
                showMainScreen();
                loadBoardDataSilently(savedPass);
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const inputVal = document.getElementById('passwordInput').value;
            const errorEl = document.getElementById('authError');
            const btn = document.getElementById('authBtn');

            btn.disabled = true;
            btn.textContent = '確認中...';
            errorEl.classList.add('hidden');

            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ type: 'auth', password: inputVal })
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    appState.password = inputVal;
                    appState.notices = res.data.notices || [];
                    appState.comments = res.data.comments || [];

                    localStorage.setItem('rg_is_authenticated', 'true');
                    localStorage.setItem('rg_pass_cache', inputVal);

                    showMainScreen();
                    renderApp();
                } else {
                    errorEl.textContent = 'パスワードが間違っています';
                    errorEl.classList.remove('hidden');
                    document.getElementById('passwordInput').value = '';
                }
            })
            .catch(err => {
                console.error(err);
                errorEl.textContent = '通信エラーが発生しました';
                errorEl.classList.remove('hidden');
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = '入室する';
            });
        }

        function loadBoardDataSilently(password) {
            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ type: 'auth', password: password })
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    appState.notices = res.data.notices || [];
                    appState.comments = res.data.comments || [];
                    renderApp();
                } else {
                    document.getElementById('noticeGrid').innerHTML = `<p class="text-center text-rose-500 py-12">データの取得に失敗しました。一度「ロック」して再度ログインしてください。</p>`;
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('noticeGrid').innerHTML = `<p class="text-center text-rose-500 py-12">ネットワーク接続を確認してください。</p>`;
            });
        }

        function showMainScreen() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            document.body.classList.remove('flex', 'justify-center', 'items-center');
        }

        function handleLogout() {
            localStorage.removeItem('rg_is_authenticated');
            localStorage.removeItem('rg_pass_cache');
            window.location.reload();
        }

        // 指定カラーコードの適用
        function getCategoryColor(category) {
            if (!category) return '#4dc4ff';
            const cat = category.trim().toLowerCase();
            if (cat.includes('通常')) return '#03af7a';      // 緑
            if (cat.includes('住み替えエントリー')) return '#f6aa00'; // オレンジ
            if (cat.includes('合格前予約')) return '#ff4b00';     // 赤
            if (cat.includes('受験時')) return '#990099';         // 紫
            return '#4dc4ff';                                    // デフォルト青
        }

        function refreshData() {
            if (!appState.password) return;
            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ type: 'auth', password: appState.password })
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    appState.notices = res.data.notices || [];
                    appState.comments = res.data.comments || [];
                    renderApp();
                }
            });
        }

        function renderApp() {
            renderCategoryTabs();
            renderGrid();
        }

        function renderCategoryTabs() {
            const categories = ["すべて", ...new Set(appState.notices.map(n => n.category).filter(Boolean))];
            const container = document.getElementById('categoryTabs');
            
            container.innerHTML = categories.map(cat => `
                <button onclick="selectCategory('${escapeHtml(cat)}')" 
                        class="px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition ${appState.currentCategory === cat ? 'bg-slate-900 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}">
                    ${escapeHtml(cat)}
                </button>
            `).join('');
        }

        function selectCategory(cat) {
            appState.currentCategory = cat;
            renderApp();
        }

        function renderGrid() {
            const grid = document.getElementById('noticeGrid');
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const sortOrder = document.getElementById('sortSelect').value;

            let filtered = appState.currentCategory === "すべて" 
                ? [...appState.notices] 
                : appState.notices.filter(n => n.category === appState.currentCategory);

            if (keyword) {
                filtered = filtered.filter(n => {
                    const targetStr = `${n.title || ""} ${n.detail || ""} ${n.author || ""} ${n.category || ""} ${n.note || ""}`.toLowerCase();
                    return targetStr.includes(keyword);
                });
            }

            filtered.sort((a, b) => {
                const dateA = new Date(a.date || a.timestamp || 0);
                const dateB = new Date(b.date || b.timestamp || 0);
                return sortOrder === 'asc' ? dateA - dateB : dateB - dateA;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<p class="text-center text-slate-400 py-12">該当する共有事項はありません。</p>`;
                return;
            }

            grid.innerHTML = filtered.map(n => {
                const noticeComments = appState.comments.filter(c => c.targetId === n.id);
                const accentColor = getCategoryColor(n.category);

                return `
                    <!-- 画像の通りの1つの完成されたEmbedカード（タップ操作不要） -->
                    <div class="bg-white border border-slate-200/90 rounded-2xl p-5 shadow-sm relative overflow-hidden flex flex-col gap-4">
                        <!-- 左側アクセントカラーバー -->
                        <div class="absolute left-0 top-0 bottom-0 w-2.5" style="background-color: ${accentColor};"></div>

                        <!-- 親のコメント本文エリア -->
                        <div class="pl-2">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider" style="background-color: ${accentColor}15; color: ${accentColor};">${escapeHtml(n.category)}</span>
                                <span class="text-[10px] text-slate-400">${escapeHtml(n.date ? String(n.date).split('T')[0] : '')} | 担当: <strong class="text-slate-700">${escapeHtml(n.author)}</strong></span>
                            </div>
                            <h3 class="font-bold text-slate-900 text-base mb-2">${escapeHtml(n.title)}</h3>
                            <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">コメント本文</h4>
                            <p class="text-slate-800 whitespace-pre-wrap text-sm leading-relaxed bg-slate-50/70 p-4 rounded-xl border border-slate-100">${escapeHtml(n.detail)}</p>
                            
                            ${n.note ? `
                                <div class="mt-3 bg-amber-50 text-amber-800 text-xs p-3 rounded-xl border border-amber-200">
                                    <strong>補足・備考:</strong> ${escapeHtml(n.note)}
                                </div>
                            ` : ''}
                        </div>

                        <!-- スレッド（枝分かれ返信）セクション -->
                        <div class="pl-2 border-t border-slate-100 pt-4">
                            <h5 class="text-xs font-bold text-slate-700 mb-3 flex items-center gap-1.5">
                                <span>スレッド返信</span>
                                <span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full text-[10px]">${noticeComments.length}</span>
                            </h5>

                            <!-- 画像と同じツリー状スレッド一覧 -->
                            <div class="relative pl-6 space-y-3">
                                ${noticeComments.length > 0 ? `<div class="absolute left-1.5 top-0 bottom-6 w-0.5 bg-slate-300 rounded"></div>` : ''}
                                
                                ${noticeComments.length === 0 ? `
                                    <p class="text-xs text-slate-400 py-1">返信スレッドはまだありません。</p>
                                ` : noticeComments.map(c => `
                                    <div class="relative flex items-start gap-2 pl-3">
                                        <!-- 枝分かれするL字の結合ライン -->
                                        <div class="absolute -left-4 top-4 w-5 h-4 border-l-2 border-b-2 border-slate-300 rounded-bl-lg pointer-events-none"></div>
                                        
                                        <!-- スレッド子カード -->
                                        <div class="flex-1 bg-slate-100/80 border border-slate-300 rounded-xl p-3 text-xs shadow-2xs">
                                            <div class="flex justify-between items-center mb-1 font-bold text-slate-700">
                                                <span>${escapeHtml(c.author)}</span>
                                                <span class="text-[10px] text-slate-400 font-normal">${escapeHtml(c.timestamp ? new Date(c.timestamp).toLocaleString('ja-JP') : '')}</span>
                                            </div>
                                            <p class="text-slate-800 whitespace-pre-wrap leading-relaxed">${escapeHtml(c.comment)}</p>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>

                            <!-- スレッド返信フォーム -->
                            <form onsubmit="submitComment(event, '${n.id}')" class="space-y-2 bg-slate-50 p-3 rounded-xl border border-slate-200 mt-4">
                                <input type="text" id="author_${n.id}" placeholder="お名前" required class="w-full text-xs px-3 py-2 bg-white text-slate-800 border border-slate-200 focus:border-blue-500 rounded-lg focus:outline-none">
                                <div class="flex gap-2">
                                    <input type="text" id="text_${n.id}" placeholder="返信メッセージを入力..." required class="flex-1 text-xs px-3 py-2 bg-white text-slate-800 border border-slate-200 focus:border-blue-500 rounded-lg focus:outline-none">
                                    <button type="submit" id="btn_${n.id}" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2 rounded-lg font-medium transition whitespace-nowrap">送信</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // コメント送信処理
        function submitComment(e, noticeId) {
            e.preventDefault();

            const authorInput = document.getElementById(`author_${noticeId}`);
            const textInput = document.getElementById(`text_${noticeId}`);
            const btn = document.getElementById(`btn_${noticeId}`);

            btn.disabled = true;
            btn.textContent = '送信中...';

            const payload = {
                type: 'comment',
                targetId: noticeId,
                author: authorInput.value,
                comment: textInput.value
            };

            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    refreshData();
                } else {
                    alert('エラーが発生しました');
                    btn.disabled = false;
                    btn.textContent = '送信';
                }
            })
            .catch(err => {
                console.error(err);
                alert('通信エラーが発生しました');
                btn.disabled = false;
                btn.textContent = '送信';
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
