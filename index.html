<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北大生協ルームガイド 共有事項</title>
    <!-- Google Fonts: Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-center items-center">

    <!-- パスワード認証画面 -->
    <div id="authScreen" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white border border-slate-200 rounded-2xl max-w-sm w-full p-6 shadow-xl">
            <h2 class="text-lg font-bold text-slate-900 mb-2 text-center">アクセス認証</h2>
            <p class="text-xs text-slate-500 mb-4 text-center">閲覧するにはパスワードを入力してください</p>
            <form onsubmit="handleLogin(event)" class="space-y-3">
                <input type="password" id="passwordInput" placeholder="パスワードを入力" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 focus:border-blue-500 text-slate-800 rounded-xl focus:outline-none">
                <p id="authError" class="text-xs text-rose-500 hidden text-center">パスワードが間違っています</p>
                <button type="submit" id="authBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl text-sm font-medium transition">入室する</button>
            </form>
        </div>
    </div>

    <!-- メインコンテンツ（認証後に表示） -->
    <div id="mainContent" class="max-w-5xl w-full mx-auto px-4 py-8 hidden min-h-screen flex flex-col">
        <!-- ヘッダー -->
        <header class="mb-6 flex justify-between items-center border-b border-slate-200 pb-4">
            <div>
                <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                    <span class="text-blue-600">#</span> 共有事項ボード
                </h1>
                <p class="text-xs text-slate-500 mt-1"></p>
            </div>
            <div class="flex items-center gap-3">
                <!-- 新規投稿ボタン（Googleフォームへ遷移） -->
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSdws5l84JJlbujW1dVDxuACpUF7g2CjC3LtNEmOgAwUyO7JcA/viewform?usp=publish-editor" target="_blank" rel="noopener noreferrer" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-medium shadow-sm transition inline-flex items-center gap-1.5">
                    <span>+ 新規投稿</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                    </svg>
                </a>
                <!-- ログアウト（ロック）ボタン -->
                <button onclick="handleLogout()" class="text-xs text-slate-400 hover:text-rose-600 transition px-2 py-1">ロック</button>
            </div>
        </header>

        <!-- 検索バー ＆ ソート切替エリア -->
        <div class="flex flex-col sm:flex-row gap-3 mb-6">
            <div class="relative flex-1">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </span>
                <input type="text" id="searchInput" oninput="renderApp()" placeholder="キーワードで検索（タイトル、内容、担当者など）..." class="w-full pl-9 pr-4 py-2 text-xs bg-white border border-slate-200 focus:border-blue-500 text-slate-800 rounded-xl focus:outline-none shadow-xs">
            </div>
            <div class="sm:w-48">
                <select id="sortSelect" onchange="renderApp()" class="w-full px-3 py-2 text-xs bg-white border border-slate-200 focus:border-blue-500 text-slate-800 rounded-xl focus:outline-none shadow-xs cursor-pointer">
                    <option value="desc">日付：新しい順 (降順)</option>
                    <option value="asc">日付：古い順 (昇順)</option>
                </select>
            </div>
        </div>

        <!-- カテゴリ切り替えタブ -->
        <div id="categoryTabs" class="flex gap-2 overflow-x-auto pb-3 mb-6 scrollbar-none">
            <!-- JavaScriptで動的生成 -->
        </div>

        <!-- 共有事項一覧（Discord Embed風カード表示） -->
        <div id="noticeGrid" class="space-y-4">
            <p class="text-center text-slate-400 py-12">データを読み込んでいます...</p>
        </div>
    </div>

    <!-- 詳細＆スレッドコメントモーダル -->
    <div id="detailModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white border border-slate-200 rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden text-slate-800">
            <!-- モーダルヘッダー -->
            <div class="p-6 border-b border-slate-100 flex justify-between items-start bg-slate-50">
                <div>
                    <span id="modalCategory" class="text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider"></span>
                    <h2 id="modalTitle" class="text-lg font-bold text-slate-900 mt-2"></h2>
                    <p class="text-xs text-slate-400 mt-1"><span id="modalDate"></span> | 担当: <span id="modalAuthor" class="text-slate-700 font-medium"></span></p>
                </div>
                <button onclick="closeDetailModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold px-2">&times;</button>
            </div>

            <!-- モーダル本文 (画像イメージに基づく統合Embedブロック) -->
            <div class="p-6 overflow-y-auto flex-1 space-y-6">
                <!-- 親カード（Embed風の大きな枠線ブロック） -->
                <div id="modalEmbedBlock" class="bg-white border border-slate-200/90 rounded-2xl p-5 shadow-sm relative overflow-hidden flex flex-col gap-4">
                    <!-- Discord Embed風 左アクセントカラーバー -->
                    <div id="modalAccentBar" class="absolute left-0 top-0 bottom-0 w-2.5"></div>

                    <!-- 親のコメント本文エリア -->
                    <div class="pl-2">
                        <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">コメント本文</h4>
                        <p id="modalDetail" class="text-slate-800 whitespace-pre-wrap text-sm leading-relaxed bg-slate-50/70 p-4 rounded-xl border border-slate-100"></p>
                        
                        <!-- 補足・備考 -->
                        <div id="modalNoteContainer" class="hidden mt-3 bg-amber-50 text-amber-800 text-xs p-3 rounded-xl border border-amber-200">
                            <strong>補足・備考:</strong> <span id="modalNote"></span>
                        </div>
                    </div>

                    <!-- スレッド（枝分かれ返信）セクション -->
                    <div class="pl-2 border-t border-slate-100 pt-4 mt-2">
                        <h5 class="text-xs font-bold text-slate-700 mb-3 flex items-center gap-1.5">
                            <span>スレッド返信</span>
                            <span id="commentCount" class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full text-[10px]">0</span>
                        </h5>

                        <!-- 枝分かれスレッド一覧エリア -->
                        <div id="commentList" class="relative pl-6 space-y-3">
                            <!-- JSでツリー線付きスレッドブロックを挿入 -->
                        </div>
                    </div>
                </div>

                <!-- スレッド返信フォーム -->
                <form onsubmit="submitComment(event)" class="space-y-2 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                    <h5 class="text-xs font-bold text-slate-700 mb-1">スレッドに返信する</h5>
                    <input type="text" id="commentAuthor" placeholder="お名前" required class="w-full text-xs px-3 py-2 bg-white text-slate-800 border border-slate-200 focus:border-blue-500 rounded-xl focus:outline-none">
                    <div class="flex gap-2">
                        <input type="text" id="commentText" placeholder="返信メッセージを入力..." required class="flex-1 text-xs px-3 py-2 bg-white text-slate-800 border border-slate-200 focus:border-blue-500 rounded-xl focus:outline-none">
