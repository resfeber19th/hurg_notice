<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北大生協ルームガイド 共有事項</title>
    <!-- Google Fonts: Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-center items-center">

    <!-- パスワード認証画面 -->
    <div id="authScreen" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white border border-slate-200 rounded-2xl max-w-sm w-full p-6 shadow-xl">
            <h2 class="text-lg font-bold text-slate-900 mb-2 text-center">アクセス認証</h2>
            <p class="text-xs text-slate-500 mb-4 text-center">閲覧するにはパスワードを入力してください</p>
            <form onsubmit="checkPassword(event)" class="space-y-3">
                <input type="password" id="passwordInput" placeholder="パスワードを入力" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 focus:border-blue-500 text-slate-800 rounded-xl focus:outline-none">
                
                <!-- 次回から入力を省略するチェックボックス -->
                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="rememberMe" class="w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500 cursor-pointer">
                    <label for="rememberMe" class="text-xs text-slate-600 cursor-pointer select-none">次回からパスワード入力を省略する</label>
                </div>

                <p id="authError" class="text-xs text-rose-500 hidden text-center">パスワードが間違っています</p>
                <button type="submit" id="authBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl text-sm font-medium transition">入室する</button>
            </form>
        </div>
    </div>

    <!-- メインコンテンツ（認証後に表示） -->
    <div id="mainContent" class="max-w-5xl w-full mx-auto px-4 py-8 hidden min-h-screen flex flex-col">
        <!-- ヘッダー -->
        <header class="mb-8 flex justify-between items-center border-b border-slate-200 pb-4">
            <div>
                <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                    <span class="text-blue-600">#</span> 共有事項ボード
                </h1>
                <p class="text-xs text-slate-500 mt-1"></p>
            </div>
            <!-- 新規投稿ボタン（Googleフォームへ遷移） -->
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSdws5l84JJlbujW1dVDxuACpUF7g2CjC3LtNEmOgAwUyO7JcA/viewform?usp=publish-editor" target="_blank" rel="noopener noreferrer" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-medium shadow-sm transition inline-flex items-center gap-1.5">
                <span>+ 新規投稿</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                </svg>
            </a>
        </header>

        <!-- カテゴリ切り替えタブ -->
        <div id="categoryTabs" class="flex gap-2 overflow-x-auto pb-3 mb-6 scrollbar-none">
            <!-- JavaScriptで動的生成 -->
        </div>

        <!-- 共有事項一覧（Discord Embed風カード表示） -->
        <div id="noticeGrid" class="space-y-4">
            <p class="text-center text-slate-400 py-12">データを読み込んでいます...</p>
        </div>
    </div>

    <!-- 詳細＆コメントモーダル -->
    <div id="detailModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white border border-slate-200 rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden text-slate-800">
            <!-- モーダルヘッダー -->
            <div class="p-6 border-b border-slate-100 flex justify-between items-start bg-slate-50">
                <div>
                    <span id="modalCategory" class="text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider"></span>
                    <h2 id="modalTitle" class="text-lg font-bold text-slate-900 mt-2"></h2>
                    <p class="text-xs text-slate-400 mt-1"><span id="modalDate"></span> | 担当: <span id="modalAuthor" class="text-slate-700 font-medium"></span></p>
                </div>
                <button onclick="closeDetailModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold px-2">&times;</button>
            </div>
            <!-- モーダル本文 -->
            <div class="p-6 overflow-y-auto flex-1 space-y-6">
                <div>
                    <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">詳細内容</h4>
                    <p id="modalDetail" class="text-slate-700 whitespace-pre-wrap text-sm leading-relaxed bg-slate-50 p-4 rounded-xl border border-slate-200"></p>
                </div>
                <div id="modalNoteContainer" class="hidden bg-amber-50 text-amber-800 text-xs p-3 rounded-xl border border-amber-200">
                    <strong>補足・備考:</strong> <span id="modalNote"></span>
                </div>

                <!-- コメントセクション -->
                <div class="border-t border-slate-100 pt-6">
                    <h4 class="text-xs font-bold text-slate-800 mb-3">スレッドコメント (<span id="commentCount">0</span>)</h4>
                    <div id="commentList" class="space-y-3 mb-4">
                        <!-- コメント挿入領域 -->
                    </div>

                    <!-- コメント入力フォーム -->
                    <form onsubmit="submitComment(event)" class="space-y-2 bg-slate-50 p-3 rounded-xl border border-slate-200">
                        <input type="text" id="commentAuthor" placeholder="お名前" required class="w-full text-xs px-3 py-2 bg-white text-slate-800 border border-slate-200 focus:border-blue-500 rounded-lg focus:outline-none">
                        <div class="flex gap-2">
                            <input type="text" id="commentText" placeholder="メッセージを送信..." required class="flex-1 text-xs px-3 py-2 bg-white text-slate-800 border border-slate-200 focus:border-blue-500 rounded-lg focus:outline-none">
                            <button type="submit" id="commentSubmitBtn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2 rounded-lg font-medium transition">送信</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

        let noticesData = [];
        let commentsData = [];
        let currentCategory = "すべて";
        let activeNoticeId = null;

            }
        });
